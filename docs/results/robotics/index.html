<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Watch TensorCode humanoid robotics experiments, with recorded comparisons and downloadable evidence.">
<title>Humanoid robotics — TensorCode</title>
<style>
:root{color-scheme:dark;--bg:#000;--ink:#f2f2f2;--muted:#7a7a7a;--line:#262626;--hard:#f2f2f2;
--pass:#00e08a;--fail:#ff4d2e;--ref:#6b8cff;--wire:#5c5c5c;--wire-hot:#f2f2f2;
--k-o:#e6e6e6;--k-a:#00e08a;--k-f:#6b8cff;--k-x:#ffb000;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.4 var(--mono);display:grid;grid-template:44px 1fr 26px/250px 1fr;overflow:hidden}
a{color:var(--ink);text-decoration:none}
a:hover{background:var(--ink);color:var(--bg)}
.titlebar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:2px solid var(--hard)}
.brand{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.brand span{color:var(--muted);font-weight:400}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
aside>div{border-bottom:1px solid var(--line);padding:14px 0}
.section{font-size:10px;letter-spacing:1.5px;color:var(--muted);padding:0 16px 10px}
.runs{display:flex;flex-direction:column}
.runs button{all:unset;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:4px;padding:9px 16px;cursor:pointer;white-space:nowrap;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.runs button:hover{color:var(--ink)}
.runs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.runs .n{opacity:.6}
.chip{font-size:10px;font-weight:700;letter-spacing:1px}
.chip.pass{color:var(--pass)}.chip.fail{color:var(--fail)}.chip.ref{color:var(--ref)}
.runs button[aria-pressed=true] .chip{color:var(--bg)}
.legend{display:flex;flex-direction:column;gap:7px;padding:0 16px;color:var(--muted);text-transform:uppercase;font-size:11px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:10px;vertical-align:-1px}
main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);min-width:0;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane+.pane{border-top:2px solid var(--hard)}
.pane-head{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:1.5px;color:var(--muted)}
.pane-head select{font:11px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--ink);padding:2px 6px;text-transform:uppercase}
.viewport{flex:1;min-height:0;display:flex}
.viewport .demo{flex:1;display:flex;min-height:0}
.viewport video{width:100%;min-width:0;height:100%;object-fit:contain;display:block}
.diagram{flex:1;min-height:0;overflow:auto;padding:12px}
.diagram svg{display:block;width:100%;height:100%;min-width:900px;font-family:var(--mono)}
.diagram .wire{fill:none;stroke:var(--wire);stroke-width:1.25;transition:stroke .1s,opacity .1s}
.diagram .port-label{font-size:10.5px;fill:#bdbdbd}
.diagram .title{font-size:11.5px;font-weight:700;fill:#000;text-transform:uppercase;letter-spacing:.3px}
.diagram .port{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.diagram .body{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.k-o .head{fill:var(--k-o)}.k-a .head{fill:var(--k-a)}.k-f .head{fill:var(--k-f)}.k-x .head{fill:var(--k-x)}
.diagram svg.focus .wire{opacity:.15}
.diagram svg.focus .wire.hot{opacity:1;stroke:var(--wire-hot);stroke-width:2}
.diagram svg.focus .block{opacity:.3}
.diagram svg.focus .block.hot{opacity:1}
.statusbar{grid-column:1/-1;display:flex;gap:20px;align-items:center;padding:0 16px;border-top:1px solid var(--line);font-size:10px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden}
.statusbar .grow{flex:1}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media(max-width:760px){body{grid-template:44px auto 1fr 26px/minmax(0,1fr);overflow:auto;height:auto}aside{border-right:0;border-bottom:2px solid var(--hard)}.legend{flex-direction:row;flex-wrap:wrap}main{grid-template-rows:auto auto}.viewport{aspect-ratio:16/9}.diagram{height:420px;flex:none}}
</style>
</head>
<body>
<div class="titlebar"><a class="brand" href="index.html">tensorcode <span>/ robotics lab</span></a><a id="evidence" href="transfer/results-v1.json">results.json ↗</a></div>
<aside>
  <div><div class="section">EXPERIMENTS</div><div class="runs" id="tabs" role="toolbar" aria-label="Experiments"></div></div>
  <div><div class="section">BLOCK TYPES</div><div class="legend"><span><i style="background:var(--k-o)"></i>Observed</span><span><i style="background:var(--k-a)"></i>Authored / estimated</span><span><i style="background:var(--k-f)"></i>Pretrained / frozen</span><span><i style="background:var(--k-x)"></i>Actuation</span></div></div>
  <div><div class="section">ARCHIVE</div><div class="legend"><a href="kitting/evidence.html">Earlier experiments ↗</a></div></div>
</aside>
<main>
<section class="pane">
  <div class="pane-head"><span>VIEWPORT · SIMULATION</span><select id="episode" aria-label="Choose recorded episode" hidden><option value="baselines/gr00t/reference.mp4" selected>ep 1 · incomplete</option><option value="baselines/gr00t/episode-1.mp4">ep 2 · success</option><option value="baselines/gr00t/episode-2.mp4">ep 3 · incomplete</option><option value="baselines/gr00t/episode-3.mp4">ep 4 · success</option></select></div>
  <div class="viewport">
<div class="demo" id="sensor-humanoid" data-title="Walk · see · grip" data-status="pass" data-evidence="transfer/results-v1.json"><video controls playsinline preload="metadata" poster="transfer/sensor-walk-grasp.png"><source src="transfer/sensor-walk-grasp.mp4" type="video/mp4"></video></div>
<div class="demo" id="trajectory-transfer" data-title="One demo, shifted" data-status="pass" data-evidence="transfer/results-v1.json"><video controls playsinline preload="metadata" poster="transfer/shift-transfer.png"><source src="transfer/shift-transfer.mp4" type="video/mp4"></video></div>
<div class="demo" id="height-limit" data-title="Height limit" data-status="fail" data-evidence="transfer/results-v1.json"><video controls playsinline preload="metadata" poster="transfer/height-transfer.png"><source src="transfer/height-transfer.mp4" type="video/mp4"></video></div>
<div class="demo" id="gr00t-reference" data-title="GR00T, own task" data-status="ref" data-evidence="baselines/gr00t/result.json" data-episodes><video controls playsinline preload="metadata" poster="baselines/gr00t/poster.png"><source src="baselines/gr00t/reference.mp4" type="video/mp4"></video></div>
  </div>
</section>
<section class="pane">
  <div class="pane-head"><span>CONTROLLER GRAPH</span><span id="graph-stats"></span></div>
  <div class="diagram" id="diagram"></div>
</section>
</main>
<div class="statusbar"><span id="status-run"></span><span class="grow"></span><span>hover a block to trace its wires</span><span>TensorCode · by TensaCo</span></div>
<script>
// Block diagrams: each block has named input ports (left edge) and output ports (right edge);
// wires connect "block.port" to "block.port" and are routed orthogonally between columns.
const W=150,COL=205,ROW=135,X0=40,Y0=16,HEAD=30,PORT=18;
const B=(col,row,kind,title,ins=[],outs=[])=>({col,row,kind,title,ins,outs});

const WALK_BLOCKS={
  cam:B(0,0,'o','RGB-D camera',['scene'],['rgb','depth']),
  prop:B(0,1,'o','Proprioception',['body'],['imu','q','contact']),
  det:B(1,0,'o','Visual detection',['rgb','depth'],['xyz']),
  est:B(1,1,'a','State estimator',['imu','q','contact'],['state']),
  bel:B(2,0,'a','Object belief',['xyz'],['obj pose']),
  traj:B(3,0,'a','Authored trajectory',['obj pose'],['hand tgt']),
  walk:B(3,1,'f','Frozen RL walker',['goal','state'],['q* legs']),
  ik:B(4,0,'a','Arm IK',['hand tgt','state'],['q* arm']),
  servo:B(5,0,'x','Joint servo',['q* arm','q* legs'],['τ']),
  robot:B(6,0,'x','G1 robot (sim)',['τ'],['scene','body'])};
const WALK_WIRES=[
  ['cam.rgb','det.rgb'],['cam.depth','det.depth'],['det.xyz','bel.xyz'],
  ['prop.imu','est.imu'],['prop.q','est.q'],['prop.contact','est.contact'],
  ['bel.obj pose','traj.obj pose'],['bel.obj pose','walk.goal'],
  ['est.state','walk.state'],['est.state','ik.state'],['traj.hand tgt','ik.hand tgt'],
  ['ik.q* arm','servo.q* arm'],['walk.q* legs','servo.q* legs'],['servo.τ','robot.τ'],
  ['robot.scene','cam.scene'],['robot.body','prop.body']];
const TRANSFER={
  blocks:{...WALK_BLOCKS,
    demo:B(2,-1,'a','One demonstration',[],['commands']),
    traj:B(3,0,'a','ALG.2 attention',['commands','obj pose'],['hand tgt'])},
  wires:[...WALK_WIRES,['demo.commands','traj.commands']]};
const DIAGRAMS={
  'sensor-humanoid':{blocks:WALK_BLOCKS,wires:WALK_WIRES},
  'trajectory-transfer':TRANSFER,
  'height-limit':TRANSFER,
  'gr00t-reference':{
    blocks:{
      cam:B(0,0,'o','Ego camera',[],['rgb']),
      enc:B(1,0,'f','Vision encoder',['rgb'],['features']),
      lang:B(1,1,'o','Instruction + joints',[],['text','q']),
      vla:B(2,0,'f','GR00T N1.6 VLA',['features','text','q'],['embed']),
      head:B(3,0,'f','Action head',['embed'],['chunk']),
      sim:B(3,1,'o','Simulator state',[],['base att','q']),
      wbc:B(4,0,'f','Whole-body RL',['chunk','base att','q'],['q*']),
      robot:B(5,0,'x','G1 + hands (sim)',['q*'],[])},
    wires:[['cam.rgb','enc.rgb'],['enc.features','vla.features'],['lang.text','vla.text'],['lang.q','vla.q'],
      ['vla.embed','head.embed'],['head.chunk','wbc.chunk'],['sim.base att','wbc.base att'],['sim.q','wbc.q'],['wbc.q*','robot.q*']]}};

function drawDiagram(spec){
  const blocks=Object.values(spec.blocks),minRow=Math.min(...blocks.map(b=>b.row));
  for(const b of blocks){b.x=X0+b.col*COL;b.y=Y0+(b.row-minRow)*ROW;b.h=HEAD+Math.max(b.ins.length,b.outs.length,1)*PORT+6}
  const rowTop=r=>Y0+(r-minRow)*ROW,rowBot=r=>Math.max(...blocks.filter(b=>b.row===r).map(b=>b.y+b.h));
  const portY=(b,i)=>b.y+HEAD+10+i*PORT;
  const used={},take=(key,base,step)=>{const k=used[key]||0;used[key]=k+1;return base+k*step};
  const peek=(key,base,step)=>base+(used[key]||0)*step;
  const gapX=g=>X0+g*COL+W+12;
  const hits=(y,a,c)=>blocks.some(b=>y>b.y-3&&y<b.y+b.h+3&&Math.max(a,c)>b.x&&Math.min(a,c)<b.x+W);
  let bottom=Math.max(...blocks.map(b=>b.y+b.h))+20,maxX=Math.max(...blocks.map(b=>b.x+W));
  const paths=spec.wires.map(([from,to])=>{
    const [sk,sp]=from.split(/\.(.*)/),[tk,tp]=to.split(/\.(.*)/),s=spec.blocks[sk],t=spec.blocks[tk];
    const x1=s.x+W+3,y1=portY(s,s.outs.indexOf(sp)),x2=t.x-3,y2=portY(t,t.ins.indexOf(tp));
    if(t.col>s.col){
      if(t.col===s.col+1||y1===y2&&!hits(y1,x1,x2)){const cx=take('g'+s.col,gapX(s.col),7);return `M${x1} ${y1}H${cx}V${y2}H${x2}`}
      const near=peek('g'+(t.col-1),gapX(t.col-1),7);
      if(!hits(y1,x1,near)){take('g'+(t.col-1),0,0);return `M${x1} ${y1}H${near}V${y2}H${x2}`}
      const far=peek('g'+s.col,gapX(s.col),7);
      if(!hits(y2,far,x2)){take('g'+s.col,0,0);return `M${x1} ${y1}H${far}V${y2}H${x2}`}
      const r=y2>y1?s.row:s.row-1,yl=take('r'+r,(rowBot(r)+rowTop(r+1))/2-6,6);
      const a=take('g'+s.col,gapX(s.col),7),c=take('g'+(t.col-1),gapX(t.col-1),7);
      return `M${x1} ${y1}H${a}V${yl}H${c}V${y2}H${x2}`;
    }
    const a=take('g'+s.col,gapX(s.col),7),c=take('g'+(t.col-1),gapX(t.col-1),7),yl=take('bottom',bottom,8);
    maxX=Math.max(maxX,a);return `M${x1} ${y1}H${a}V${yl}H${c}V${y2}H${x2}`;
  });
  const height=(used.bottom?bottom+used.bottom*8:bottom-6);
  const label=(x,y,t,anchor)=>`<text class="port-label" x="${x}" y="${y}" text-anchor="${anchor}">${t}</text>`;
  const port=(x,y)=>`<rect class="port" x="${x-3}" y="${y-3}" width="6" height="6"/>`;
  const ends=spec.wires.map(([f,t])=>[f.split('.')[0],t.split('.')[0]]);
  const el=document.getElementById('diagram');
  el.innerHTML=`<svg viewBox="0 0 ${maxX+30} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Controller block diagram" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--wire)"/></marker></defs>
${paths.map((d,i)=>`<path class="wire" data-from="${ends[i][0]}" data-to="${ends[i][1]}" d="${d}" marker-end="url(#arrow)"/>`).join('')}
${Object.entries(spec.blocks).map(([k,b])=>`<g class="block k-${b.kind}" data-id="${k}"><rect class="body" x="${b.x}" y="${b.y}" width="${W}" height="${b.h}"/><rect class="head" x="${b.x}" y="${b.y}" width="${W}" height="${HEAD-4}"/>
<text class="title" x="${b.x+W/2}" y="${b.y+17}" text-anchor="middle">${b.title}</text>
${b.ins.map((p,i)=>port(b.x,portY(b,i))+label(b.x+8,portY(b,i)+4,p,'start')).join('')}
${b.outs.map((p,i)=>port(b.x+W,portY(b,i))+label(b.x+W-8,portY(b,i)+4,p,'end')).join('')}</g>`).join('')}
</svg>`;
  const svg=el.querySelector('svg');
  svg.querySelectorAll('.block').forEach(g=>{
    g.addEventListener('mouseenter',()=>{
      const id=g.dataset.id,linked=new Set([id]);svg.classList.add('focus');
      svg.querySelectorAll('.wire').forEach(w=>{const hot=w.dataset.from===id||w.dataset.to===id;w.classList.toggle('hot',hot);if(hot){linked.add(w.dataset.from);linked.add(w.dataset.to)}});
      svg.querySelectorAll('.block').forEach(b=>b.classList.toggle('hot',linked.has(b.dataset.id)));
    });
    g.addEventListener('mouseleave',()=>svg.classList.remove('focus'));
  });
  document.getElementById('graph-stats').textContent=`${blocks.length} BLOCKS · ${spec.wires.length} WIRES`;
}

const panels=[...document.querySelectorAll('.demo')],tabs=document.getElementById('tabs'),episode=document.getElementById('episode');
const STATUS={pass:'PASS',fail:'FAIL',ref:'REF'};
panels.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.dataset.id=p.id;
  b.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span><span>${p.dataset.title}</span><span class="chip ${p.dataset.status}">${STATUS[p.dataset.status]}</span>`;
  b.addEventListener('click',()=>show(p.id,true));tabs.append(b)});
function show(id,updateHash){
  const sel=panels.find(p=>p.id===id)||panels[0];
  panels.forEach(p=>{p.hidden=p!==sel;if(p.hidden)p.querySelector('video').pause()});
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===sel.id));
  document.getElementById('evidence').href=sel.dataset.evidence;
  document.getElementById('evidence').textContent=sel.dataset.evidence.split('/').pop()+' ↗';
  document.getElementById('status-run').textContent=`run: ${sel.id} · ${sel.dataset.evidence}`;
  episode.hidden=!('episodes' in sel.dataset);
  drawDiagram(DIAGRAMS[sel.id]);
  if(updateHash)history.replaceState(null,'','#'+sel.id);
}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
episode.addEventListener('change',()=>{const v=document.querySelector('#gr00t-reference video');v.src=episode.value;v.removeAttribute('poster');v.load();v.play().catch(()=>{})});
</script>
</body>
</html>
