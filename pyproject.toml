[project]
name = "tensorcode"
version = "0.4.0a3"
description = "Composable cognitive operations and traceable, trainable Python programs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jacob Valdez", email = "jacob.valdez@tensaco.ai"}]
keywords = ["machine-learning", "pytorch", "transformers", "tracing", "training", "cognitive-architecture", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
vec = ["torch>=2.4", "numpy>=1.26", "safetensors>=0.4"]
tools = ["torch>=2.4", "torchvision>=0.19", "transformers>=5.0,<6", "huggingface-hub>=0.34", "safetensors>=0.4", "tokenizers>=0.21", "pillow>=10"]
local = ["torch>=2.4", "torchvision>=0.19", "transformers>=5.0,<6", "pillow>=10"]
pretrained = ["tensorcode[tools]"]
diffusion = ["tensorcode[pretrained]", "diffusers>=0.40,<1"]
dev = ["pytest>=8", "build>=1.2", "pillow>=10", "pyarrow>=18"]

[project.urls]
Homepage = "https://tensorcode.dev"
Documentation = "https://tensorcode.dev/docs/"
Source = "https://github.com/TensaCo/tensacode-py"
Issues = "https://github.com/TensaCo/tensacode-py/issues"
Changelog = "https://github.com/TensaCo/tensacode-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorcode"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
