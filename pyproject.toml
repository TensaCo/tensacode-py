[project]
name = "tensorcode"
version = "0.3.0a1"
description = "Composable cognitive operations and traceable, trainable Python programs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jacob Valdez", email = "jacob.valdez@tensaco.ai"}]
dependencies = []

[project.optional-dependencies]
vec = ["torch>=2.4", "numpy>=1.26"]
tools = ["torch>=2.4", "transformers>=5.0,<6", "huggingface-hub>=0.34", "safetensors>=0.4", "tokenizers>=0.21", "pillow>=10"]
local = ["torch>=2.4", "torchvision>=0.19", "transformers>=5.0,<6", "pillow>=10"]
dev = ["pytest>=8", "build>=1.2", "pillow>=10"]

[project.urls]
Source = "https://github.com/TensaCo/tensacode-py"
Issues = "https://github.com/TensaCo/tensacode-py/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensorcode"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
