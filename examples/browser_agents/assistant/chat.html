<title>Ubuntu Assistant</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --ink: #0d1015; --panel: #151a21; --panel-2: #10141a; --rule: #252c36; --rule-2: #313a46;
    --text: #d9dee7; --muted: #8792a3; --intent: #f2b35b; --thought: #79bdf2; --you: #1d2a38; --good: #49c28b; --bad: #ee6a5f;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cond: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; background: var(--ink); color: var(--text); }
  body { margin: 0; font: 14px/1.45 var(--sans); padding-inline: 16px; padding-block: 12px; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr; gap: 12px; overflow: hidden; }
  header { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); min-width: 0; }
  .brand { font: 600 18px/1 var(--cond); letter-spacing: .02em; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand small { font: 400 12px/1 var(--sans); color: var(--muted); letter-spacing: 0; margin-left: 10px; }
  .stat { display: grid; gap: 2px; min-width: 7ch; }
  .stat b { font: 600 20px/1 var(--cond); font-variant-numeric: tabular-nums; }
  .stat span { font: 500 10.5px/1 var(--cond); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
  .stat.zero b { color: var(--good); }

  main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(340px, 1fr); gap: 16px; min-height: 0; }
  .left { display: grid; grid-template-rows: auto 38px minmax(0, 1fr); gap: 0; min-height: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .screen { position: relative; aspect-ratio: 1280 / 800; max-width: 100%; background: #07090c; }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .screen .idle { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 13px var(--mono); }
  .now { display: flex; gap: 10px; align-items: center; padding: 0 12px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-width: 0; }
  .now span { font: 600 11px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--intent); flex: none; }
  .now code { font: 13px/1 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .now .lag { margin-left: auto; font: 11px var(--mono); color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .thoughts { margin: 0; padding: 8px 12px; list-style: none; font: 12px/1.55 var(--mono); color: var(--thought); overflow: hidden; min-height: 0; }
  .thoughts li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thoughts li.old { color: #79bdf280; }

  .right { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; min-height: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .log { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; scrollbar-gutter: stable; }
  .msg { max-width: 92%; display: grid; gap: 6px; }
  .msg .who { font: 600 10.5px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .msg .body { padding: 9px 11px; border-radius: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; }
  .msg.user .who { text-align: right; }
  .msg.user .body { background: var(--you); border: 1px solid #2b3d51; }
  .msg.agent .body { background: var(--panel-2); border: 1px solid var(--rule); font: 13px/1.5 var(--mono); }
  .msg.agent .who em { font-style: normal; color: var(--muted); font-family: var(--mono); letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .understood { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }
  .understood code { font: 11.5px/1.3 var(--mono); padding: 3px 6px; border-radius: 5px; background: #1a2230; border: 1px solid var(--rule-2); color: var(--thought); }
  .understood code.unknown { color: var(--bad); border-color: #5a2b2b; }
  .working { align-self: flex-start; font: 12px var(--mono); color: var(--intent); }
  .suggest { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; border-top: 1px solid var(--rule); scrollbar-width: thin; }
  .suggest button { flex: none; font: 12px/1 var(--sans); color: var(--text); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 999px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .suggest button:hover { border-color: var(--thought); }
  form { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--rule); }
  textarea { font: 14px/1.4 var(--sans); color: var(--text); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 8px; padding: 9px 10px; resize: none; height: 62px; box-sizing: border-box; }
  .buttons { display: grid; gap: 6px; grid-template-rows: 1fr 1fr; }
  .buttons button { font: 600 13px/1 var(--cond); letter-spacing: .04em; border-radius: 7px; padding: 0 16px; cursor: pointer; border: 1px solid var(--intent); background: var(--intent); color: #1a1206; }
  .buttons button.stop { background: transparent; color: var(--bad); border-color: #6b3434; }
  .buttons button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--thought); outline-offset: 1px; }

  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    main { grid-template-columns: 1fr; }
    .left { grid-template-rows: auto 38px 150px; }
    .right { height: 70vh; }
    .brand small { display: none; }
    header { gap: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header>
  <div class="brand">Ubuntu Assistant<small>Works a simulated Ubuntu machine through its screen. Acts on files and answers questions from what it perceives and what you tell it. No model unless it meets something new (counted below).</small></div>
  <div class="stat zero"><b id="s-model">0</b><span>Model calls</span></div>
  <div class="stat"><b id="s-actions">0</b><span>UI actions</span></div>
  <div class="stat"><b id="s-last">–</b><span>Last reply</span></div>
  <div class="stat"><b id="s-beliefs">0</b><span>Beliefs</span></div>
</header>

<main>
  <section class="left" aria-label="The machine">
    <div class="screen"><div class="idle" id="idle">connecting to the desktop…</div><img id="frame" alt="Live view of the Ubuntu desktop" hidden /></div>
    <div class="now"><span>Now</span><code id="now">idle</code><output class="lag" id="lag"></output></div>
    <ul class="thoughts" id="thoughts" aria-label="Newest thoughts"></ul>
  </section>

  <section class="right" aria-label="Conversation">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="suggest" id="suggest" aria-label="Try"></div>
    <form id="form">
      <textarea id="text" placeholder="Ask me to do something on this computer…  (Enter to send, Shift+Enter for a new line)" aria-label="Message"></textarea>
      <div class="buttons"><button type="submit" id="send">Send</button><button type="button" class="stop" id="stop" disabled>Stop</button></div>
    </form>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), thoughts = $("thoughts"), img = $("frame");
  const SUGGEST = [
    "what's on my desktop?", "make a folder called recipes on my desktop", "create pasta.txt in it saying 'boil water'",
    "add 'salt the water' to pasta.txt", "read it", "make recipes a git repo then commit everything in recipes as 'first'",
    "find all pdfs", "which files mention dns?", "how much disk space is left?", "what's my ip?", "open firefox",
    "my name is Jacob", "what is my name?", "how many icons are in the sidebar?", "what colour is the display?",
    "which apps are open?", "open the app used for writing code", "what did you just do?", "why did you do that?",
    "delete pasta.txt", "`ls -la ~`", "help",
  ];
  for (const s of SUGGEST) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = s;
    b.onclick = () => { $("text").value = s; $("text").focus(); };
    $("suggest").append(b);
  }

  let stream = [], actions = 0, working = null, workingStart = 0, pendingUnderstood = [];
  function scrollDown() { log.scrollTop = log.scrollHeight; }
  function bubble(from, text, extra) {
    const m = document.createElement("div"); m.className = `msg ${from}`;
    const who = document.createElement("div"); who.className = "who"; who.textContent = from === "user" ? "You" : "Assistant";
    if (extra) { const em = document.createElement("em"); em.textContent = extra; who.append(em); }
    const body = document.createElement("div"); body.className = "body"; body.textContent = text;
    m.append(who, body);
    if (working && from === "agent") log.insertBefore(m, working); else log.append(m);
    scrollDown();
    return m;
  }
  function understood(frames) {
    const users = log.querySelectorAll(".msg.user");
    const target = users[users.length - 1];
    if (!target || target.querySelector(".understood")) return;
    const row = document.createElement("div"); row.className = "understood";
    for (const f of frames) {
      const c = document.createElement("code");
      const slots = Object.entries(f.slots).map(([k, v]) => `${k}=${v}`).join(" ");
      c.textContent = `${f.act}${slots ? " " + slots : ""}`;
      c.title = `from: “${f.words}”`;
      if (f.act === "unknown") c.className = "unknown";
      row.append(c);
    }
    target.append(row); scrollDown();
  }
  function setWorking(on) {
    $("stop").disabled = !on;
    if (on && !working) {
      working = document.createElement("div"); working.className = "working"; log.append(working); workingStart = performance.now(); tickWorking(); scrollDown();
    } else if (!on && working) { working.remove(); working = null; $("now").textContent = "idle"; }
  }
  function tickWorking() { if (!working) return; working.textContent = `working… ${((performance.now() - workingStart) / 1000).toFixed(1)} s`; requestAnimationFrame(tickWorking); }

  // frames: never queue; show the newest one when the previous has decoded
  let decoding = false, nextFrame = null, lastFrameT = 0;
  function showFrame(ev) {
    nextFrame = ev;
    if (decoding) return;
    const f = nextFrame; nextFrame = null; decoding = true; lastFrameT = f.t;
    img.onload = img.onerror = () => { decoding = false; if (nextFrame) showFrame(nextFrame); };
    img.src = "data:image/jpeg;base64," + f.data; img.hidden = false; $("idle").hidden = true;
  }
  setInterval(() => { if (lastFrameT) $("lag").textContent = `video ${Math.max(0, Date.now() / 1000 - lastFrameT).toFixed(1)} s behind`; }, 500);

  const src = new EventSource("events");
  src.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "frame") return showFrame(ev);
    if (ev.type === "chat") bubble(ev.from, ev.text, ev.from === "agent" && ev.seconds != null ? `${ev.seconds.toFixed(2)} s` : "");
    else if (ev.type === "understood") understood(ev.frames);
    else if (ev.type === "busy") {
      setWorking(ev.busy);
      if (!ev.busy) {
        actions += ev.actions || 0; $("s-actions").textContent = actions;
        $("s-last").textContent = `${ev.seconds.toFixed(1)} s`;
        $("s-model").textContent = String(ev.model_calls || 0);
      }
    } else if (ev.type === "cycle") {
      if (ev.intention) $("now").textContent = ev.intention;
      $("s-beliefs").textContent = ev.beliefs;
      for (const line of ev.thoughts || []) stream.push(line);
      stream = stream.slice(-14);
      thoughts.replaceChildren(...stream.map((s, i) => { const li = document.createElement("li"); li.textContent = "· " + s; if (i < stream.length - 5) li.className = "old"; return li; }));
    } else if (ev.type === "ready") { $("idle").textContent = "desktop ready"; }
  };
  src.onerror = () => { $("now").textContent = "reconnecting to the assistant…"; };

  async function send(text) {
    text = text.trim(); if (!text) return;
    $("text").value = "";
    await fetch("say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
  }
  $("form").onsubmit = (e) => { e.preventDefault(); send($("text").value); };
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("text").value); } });
  $("stop").onclick = () => fetch("stop", { method: "POST" });
  $("text").focus();
})();
</script>
