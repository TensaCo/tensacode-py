<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Northgate Supply · Displays</title>
<link rel="stylesheet" href="common.css" />
<style>
  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  article { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 3px; }
  article h3 { margin: 0 0 2px; font-size: 13px; }
  article p { margin: 0; font-size: 12px; color: var(--muted); }
  article p.price { font-size: 15px; color: var(--ink); font-weight: 700; }
  article button { margin-top: 6px; }
  nav.pages { display: flex; gap: 6px; margin-top: 10px; }
  nav.pages button[aria-current=true] { background: var(--ink); color: #fff; }
  #brief p { margin: 0; font-size: 14px; }
  aside ul { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 6px; }
  aside li { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; align-items: center; }
</style>
</head>
<body>
<header class="app"><span class="logo">Northgate Supply</span><span class="muted">Procurement · Displays & peripherals</span></header>
<main>
  <section id="brief" class="panel" aria-label="Brief" style="margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between">
    <p id="brief-text"></p>
    <button id="nomatch" type="button">No product meets the brief</button>
  </section>
  <div class="layout">
    <section aria-label="Catalog"><div class="grid" id="grid"></div><nav class="pages" aria-label="Pages" id="pages"></nav></section>
    <aside class="panel" aria-label="Cart">
      <h2 style="margin:0 0 8px;font-size:15px">Cart</h2>
      <ul id="cart"></ul>
      <p id="total" style="margin:0 0 8px">Total: $0.00</p>
      <button id="checkout" class="primary" type="button" disabled>Checkout</button>
      <p id="status" style="margin:10px 0 0;font-size:12px"></p>
    </aside>
  </div>
</main>
<script type="module">
import { rng, h, server, toast, modal } from "./common.js";
const R = rng();
const TODAY = new Date(Date.UTC(2026, 8, 17));
const DAY = 86400000;
const fmtDay = (d) => d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
const BRANDS = ["Novaview", "Clarion", "Pixelforge", "Luma", "Arcadia", "Vertex", "Halden", "Orbis"];
const PANELS = ["IPS", "VA", "QHD IPS", "4K IPS", "OLED"];
const products = [];
for (let i = 0; i < 36; i++) {
  const kind = i < 26 ? "Monitor" : R.pick(["Keyboard", "Webcam"]);
  const size = R.pick([24, 27, 27, 32, 34]);
  const name = kind === "Monitor" ? `${R.pick(BRANDS)} ${size}" ${R.pick(PANELS)} Monitor ${String.fromCharCode(65 + (i % 26))}${i}` : `${R.pick(BRANDS)} ${kind} ${i}`;
  products.push({ name, kind, size: kind === "Monitor" ? size : null, price: R.int(14, 49) * 10 - 0.01, rating: R.int(36, 49) / 10,
    reviews: R.int(12, 4800), inStock: R.chance(0.85), arrives: new Date(TODAY.getTime() + R.int(1, 9) * DAY), changes: R.chance(0.25) ? R.int(2, 6) * 10 : 0 });
}
const shuffled = R.shuffle(products);
const brief = { size: R.pick([27, 32]), rating: R.pick([4.2, 4.3, 4.5]), budget: R.pick([299, 349, 399]), deadline: new Date(TODAY.getTime() + R.int(4, 7) * DAY) };
const who = R.pick(["Dana", "the design team", "our new analyst", "Priya"]);
const md = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const sizeText = R.pick([`at least ${brief.size} inches`, `${brief.size}-inch or larger`, `no smaller than ${brief.size}"`]);
const ratingText = R.pick([`rated ${brief.rating} or higher`, `${brief.rating}+ stars`, `a rating of at least ${brief.rating}`]);
const priceText = R.pick([`under $${brief.budget}`, `max $${brief.budget}`, `budget $${brief.budget}`]);
const dateText = R.pick([`arriving by ${fmtDay(brief.deadline)}`, `delivered no later than ${md(brief.deadline)}`, `needs to arrive by ${md(brief.deadline)}`]);
document.getElementById("brief-text").textContent =
  R.pick([`Buy a monitor for ${who}: ${sizeText}, ${ratingText}, ${priceText}, ${dateText}. Pick the cheapest that qualifies.`,
          `Need a display for ${who} — ${priceText}, ${sizeText}, ${dateText}, ${ratingText}. Cheapest option that fits, please.`]);

const cart = [];
const orders = [];
let reported = false, page = 0;
const perPage = 12, pages = Math.ceil(shuffled.length / perPage);
const money = (x) => `$${x.toFixed(2)}`;

function render() {
  const grid = document.getElementById("grid");
  grid.replaceChildren(...shuffled.slice(page * perPage, (page + 1) * perPage).map((p) => h("article", { "aria-label": p.name },
    h("h3", {}, p.name), h("p", { class: "price" }, money(p.price)), h("p", {}, `${p.rating.toFixed(1)} ★ · ${p.reviews.toLocaleString()} reviews`),
    h("p", {}, p.inStock ? "In stock" : "Out of stock"), h("p", {}, `Arrives ${fmtDay(p.arrives)}`),
    h("button", { type: "button", onclick: () => add(p), disabled: !p.inStock }, "Add to cart"))));
  document.getElementById("pages").replaceChildren(
    h("button", { type: "button", onclick: () => go(page - 1), disabled: page === 0 }, "Previous"),
    ...Array.from({ length: pages }, (_, i) => h("button", { type: "button", "aria-label": `Page ${i + 1}`, "aria-current": i === page ? "true" : "false", onclick: () => go(i) }, String(i + 1))),
    h("button", { type: "button", onclick: () => go(page + 1), disabled: page === pages - 1 }, "Next"));
  document.getElementById("cart").replaceChildren(...cart.map((p) => h("li", {}, h("span", {}, `${p.name} — ${money(p.price)}`), h("button", { type: "button", "aria-label": `Remove ${p.name}`, onclick: () => { cart.splice(cart.indexOf(p), 1); render(); } }, "Remove"))));
  document.getElementById("total").textContent = `Total: ${money(cart.reduce((a, p) => a + p.price, 0))}`;
  document.getElementById("checkout").disabled = !cart.length;
}
async function go(i) { if (i < 0 || i >= pages) return; await server(R.int(30, 90)); page = i; render(); }
async function add(p) {
  await server(R.int(40, 120));
  if (p.changes) {
    const was = p.price; p.price = p.price + p.changes; p.changes = 0; render();
    const ok = await modal("Price updated", `${p.name} is now ${money(p.price)} (was ${money(was)}).`, [["Keep shopping", false], ["Add anyway", true, "primary"]]);
    if (!ok) return;
  }
  if (!cart.includes(p)) cart.push(p);
  render(); toast(`Added ${p.name}`, "ok");
}
document.getElementById("checkout").addEventListener("click", async () => {
  const ok = await modal("Place order?", `${cart.length} item(s), total ${money(cart.reduce((a, p) => a + p.price, 0))}.`, [["Cancel", false], ["Place order", true, "primary"]]);
  if (!ok) return;
  await server(R.int(80, 200));
  const id = `ORD-${5500 + orders.length}`;
  orders.push({ id, items: cart.map((p) => p.name) }); cart.length = 0; render();
  document.getElementById("status").textContent = `Order ${id} placed`;
  toast(`Order ${id} placed`, "ok");
});
document.getElementById("nomatch").addEventListener("click", async () => {
  const ok = await modal("Report no match?", "Tell the requester that nothing in the catalog meets the brief.", [["Cancel", false], ["Report", true, "danger"]]);
  if (!ok) return;
  await server(R.int(40, 90)); reported = true;
  document.getElementById("status").textContent = "Reported: no suitable product";
  toast("Reported: no suitable product", "ok");
});
render();

window.__score = () => {
  const ok = (p) => p.kind === "Monitor" && p.size >= brief.size && p.rating >= brief.rating && p.price <= brief.budget && p.inStock && p.arrives <= brief.deadline;
  const feasible = products.filter(ok).sort((a, b) => a.price - b.price || b.rating - a.rating);
  const best = feasible[0] || null;
  // products equal to the best on price and rating are equally correct: the brief does not rank them
  const optimal = feasible.filter((p) => best && p.price === best.price && p.rating === best.rating).map((p) => p.name);
  const correct = best ? (!reported && orders.length === 1 && orders[0].items.length === 1 && optimal.includes(orders[0].items[0])) : (reported && orders.length === 0);
  return { task: "shop", items: 1, correct: correct ? 1 : 0, duplicates: Math.max(0, orders.length - 1), best: best && best.name, optimal, feasible: feasible.length, orders, reported, brief: document.getElementById("brief-text").textContent };
};
</script>
</body>
</html>
