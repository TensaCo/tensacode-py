<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ledgerline · Accounts payable</title>
<link rel="stylesheet" href="common.css" />
<style>
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .pager p { margin: 0; color: var(--muted); font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  textarea { min-height: 70px; }
  .two { display: grid; grid-template-columns: 360px 1fr; gap: 14px; }
</style>
</head>
<body>
<header class="app"><span class="logo">Ledgerline</span>
  <nav aria-label="Views" role="tablist">
    <button role="tab" id="tab-inv" aria-selected="true">Invoices</button>
    <button role="tab" id="tab-pay" aria-selected="false">Payments</button>
    <button role="tab" id="tab-dis" aria-selected="false">Disputes</button>
  </nav>
</header>
<main id="main"></main>
<script type="module">
import { rng, h, server, toast, combobox } from "./common.js";
const R = rng();
const VENDORS = ["Acme Tooling", "Brightline Logistics", "Cobalt Office", "Delta Freight", "Evergreen IT", "Fulcrum Legal"];
const short = (v) => v.split(" ")[0].toUpperCase();
const money = (x) => "$" + x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const invoices = Array.from({ length: 14 }, (_, i) => ({ id: `INV-${1001 + i}`, vendor: R.pick(VENDORS), issued: `2026-08-${String(R.int(1, 28)).padStart(2, "0")}`, amount: R.int(12, 480) * 25 }));
const kinds = R.shuffle(["Amount mismatch", "Duplicate payment", "Missing payment", "Unknown reference", "Amount mismatch", "Duplicate payment"]).slice(0, R.int(2, 4));
const targets = R.shuffle(invoices.map((_, i) => i));
const expected = [];
const payments = [];
const ref = (inv) => R.pick([`${inv.id} ${short(inv.vendor)}`, `Invoice ${inv.id.slice(4)}`, `inv#${inv.id.slice(4)}`, `${short(inv.vendor)} / INV${inv.id.slice(4)}`]);
const special = new Map();
kinds.forEach((k, j) => special.set(targets[j], k));
invoices.forEach((inv, i) => {
  const k = special.get(i);
  if (k === "Missing payment") { expected.push([k, inv.id]); return; }
  const amt = k === "Amount mismatch" ? inv.amount + R.pick([-1, 1]) * R.int(1, 8) * 25 : inv.amount;
  payments.push({ ref: ref(inv), amount: amt });
  if (k === "Amount mismatch") expected.push([k, inv.id]);
  if (k === "Duplicate payment") { payments.push({ ref: ref(inv), amount: amt }); expected.push([k, inv.id]); }
});
if (kinds.includes("Unknown reference")) payments.push({ ref: `INV-${R.int(1901, 1999)} ${short(R.pick(VENDORS))}`, amount: R.int(12, 480) * 25, unknown: true });
const shuffledPayments = R.shuffle(payments).map((p, i) => ({ ...p, id: `PAY-${2001 + i}`, date: `2026-09-${String(R.int(1, 15)).padStart(2, "0")}` }));
for (const p of shuffledPayments) if (p.unknown) expected.push(["Unknown reference", p.id]);

const disputes = [];
let view = "inv", invPage = 0, payPage = 0;
const PER = 8;

function table(label, header, rows) {
  return h("table", { "aria-label": label }, h("thead", {}, h("tr", {}, header.map((c) => h("th", {}, c)))), h("tbody", {}, rows.map((r) => h("tr", {}, r.map((c, i) => h("td", { class: i === r.length - 1 ? "num" : "" }, c))))));
}
function pager(label, page, total, set) {
  const pages = Math.ceil(total / PER);
  return h("div", { class: "pager", "aria-label": label },
    h("button", { type: "button", disabled: page === 0, onclick: async () => { await server(R.int(20, 70)); set(page - 1); } }, "Previous page"),
    h("p", {}, `Page ${page + 1} of ${pages}`),
    h("button", { type: "button", disabled: page >= pages - 1, onclick: async () => { await server(R.int(20, 70)); set(page + 1); } }, "Next page"));
}
function render() {
  for (const [id, v] of [["tab-inv", "inv"], ["tab-pay", "pay"], ["tab-dis", "dis"]]) document.getElementById(id).setAttribute("aria-selected", String(view === v));
  const main = document.getElementById("main");
  if (view === "inv") {
    main.replaceChildren(h("section", { class: "panel", "aria-label": "Invoice list" }, h("h2", { style: "margin:0 0 8px;font-size:15px" }, "Vendor invoices"),
      table("Invoices", ["Invoice", "Vendor", "Issued", "Amount"], invoices.slice(invPage * PER, (invPage + 1) * PER).map((x) => [x.id, x.vendor, x.issued, money(x.amount)])),
      pager("Invoice list", invPage, invoices.length, (p) => { invPage = p; render(); })));
  } else if (view === "pay") {
    main.replaceChildren(h("section", { class: "panel", "aria-label": "Payment list" }, h("h2", { style: "margin:0 0 8px;font-size:15px" }, "Bank feed · outgoing payments"),
      table("Payments", ["Payment", "Date", "Reference", "Amount"], shuffledPayments.slice(payPage * PER, (payPage + 1) * PER).map((x) => [x.id, x.date, x.ref, money(x.amount)])),
      pager("Payment list", payPage, shuffledPayments.length, (p) => { payPage = p; render(); })));
  } else {
    const type = combobox("d-type", "Issue type", ["Amount mismatch", "Duplicate payment", "Missing payment", "Unknown reference"]);
    const key = h("input", { id: "d-key", autocomplete: "off", placeholder: "INV-1234 or PAY-1234" });
    const evidence = h("textarea", { id: "d-evidence" });
    const submit = h("button", { class: "primary", type: "button", onclick: async () => {
      if (!type.value || !/^(INV|PAY)-\d{4}$/.test(key.value.trim()) || evidence.value.trim().length < 10) return toast("Complete all fields: issue type, a valid INV- or PAY- id, and evidence.", "error");
      await server(R.int(60, 160));
      if (R.chance(0.12)) return toast("Service unavailable (503). Nothing was saved — try again.", "error");
      disputes.push({ type: type.value, key: key.value.trim(), evidence: evidence.value.trim() });
      toast(`Dispute filed for ${key.value.trim()}`, "ok"); render();
    } }, "File dispute");
    main.replaceChildren(h("div", { class: "two" },
      h("section", { class: "panel", "aria-label": "New dispute" }, h("h2", { style: "margin:0 0 8px;font-size:15px" }, "New dispute"), type.el,
        h("div", { class: "field" }, h("label", { for: "d-key" }, "Invoice / reference"), key),
        h("div", { class: "field" }, h("label", { for: "d-evidence" }, "Evidence"), evidence), submit),
      h("section", { class: "panel", "aria-label": "Filed disputes" }, h("h2", { style: "margin:0 0 8px;font-size:15px" }, "Filed disputes"),
        table("Filed disputes", ["Type", "Invoice / reference", "Evidence"], disputes.map((d) => [d.type, d.key, d.evidence])))));
  }
}
document.getElementById("tab-inv").onclick = async () => { await server(30); view = "inv"; render(); };
document.getElementById("tab-pay").onclick = async () => { await server(30); view = "pay"; render(); };
document.getElementById("tab-dis").onclick = async () => { await server(30); view = "dis"; render(); };
render();

window.__score = () => {
  const want = new Set(expected.map(([t, k]) => `${t}|${k}`));
  const got = disputes.map((d) => `${d.type}|${d.key}`);
  const matched = [...want].filter((w) => got.includes(w)).length;
  const extras = got.filter((g) => !want.has(g)).length;
  const dups = got.length - new Set(got).size;
  return { task: "recon", items: want.size, correct: Math.max(0, matched - extras), duplicates: dups, expected, filed: disputes };
};
</script>
</body>
</html>
