<!doctype html>
<title>General Agent</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --ink: #0d1015; --panel: #151a21; --panel-2: #10141a; --rule: #252c36; --rule-2: #313a46;
    --text: #d9dee7; --muted: #8792a3; --accent: #f2b35b; --info: #79bdf2; --you: #1d2a38; --good: #49c28b; --bad: #ee6a5f;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; background: var(--ink); color: var(--text); }
  body { margin: 0; font: 14px/1.45 var(--sans); padding: 12px 16px; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr; gap: 12px; overflow: hidden; }
  header { display: flex; align-items: baseline; gap: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); min-width: 0; flex-wrap: wrap; }
  header h1 { font: 600 17px/1 var(--sans); margin: 0 auto 0 0; }
  header .stat { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  header .stat b { color: var(--text); font-weight: 500; }
  .chip { font: 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--rule-2); border-radius: 20px; padding: 4px 9px; }
  .chip.on { color: var(--info); border-color: #2c4a63; }

  /* Chat is the page. Anything the agent is plugged into sits beside it, and only if there is
     something to look at. */
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 16px; min-height: 0; }
  .chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  aside { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-height: 0; }
  aside.empty { display: none; }

  .monitors { display: grid; gap: 10px; align-content: start; max-height: 58%; overflow-y: auto; }
  .monitor { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .monitor > summary { font: 500 11.5px/1 var(--mono); color: var(--muted); padding: 8px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; list-style: none; }
  .monitor > summary::-webkit-details-marker { display: none; }
  .monitor > summary::before { content: "▾"; color: var(--rule-2); font-size: 10px; }
  .monitor:not([open]) > summary::before { content: "▸"; }
  .monitor > summary .live { margin-left: auto; color: var(--good); font-size: 10px; }
  .monitor .screen { position: relative; aspect-ratio: 1280 / 800; background: #07090c; border-top: 1px solid var(--rule); }
  .monitor .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  .trace { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow-y: auto; padding: 8px 12px; font: 12px/1.5 var(--mono); scrollbar-gutter: stable; min-height: 0; }
  .trace .ev { display: grid; grid-template-columns: 78px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #1e242d; }
  .trace .ev .t { color: var(--accent); text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; padding-top: 2px; }
  .trace .ev .kv { overflow-wrap: anywhere; color: var(--text); }
  .trace .ev .kv span { color: var(--muted); }
  .trace .ev.bad .t { color: var(--bad); } .trace .ev.good .t { color: var(--good); }

  .log { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; scrollbar-gutter: stable; }
  .msg { max-width: 82%; display: grid; gap: 4px; }
  .msg .who { font: 600 10.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .msg .body { padding: 9px 11px; border-radius: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; } .msg.user .who { text-align: right; }
  .msg.user .body { background: var(--you); border: 1px solid #2b3d51; }
  .msg.agent .body { background: var(--panel-2); border: 1px solid var(--rule); }
  .msg.note .body { background: transparent; border: 1px dashed var(--rule-2); color: var(--muted); font: 12px var(--mono); }
  .working { font: 12px var(--mono); color: var(--accent); }
  form { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--rule); }
  textarea { font: 14px/1.4 var(--sans); color: var(--text); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 8px; padding: 9px 10px; resize: vertical; min-height: 62px; box-sizing: border-box; }
  .side { display: grid; gap: 6px; }
  .attach { font: 600 12px/1 var(--sans); border: 1px solid var(--rule-2); border-radius: 7px; padding: 8px 12px; cursor: pointer; text-align: center; color: var(--muted); }
  .pending { grid-column: 1 / -1; font: 12px var(--mono); color: var(--info); }
  .msg .thumb { max-width: 180px; border-radius: 6px; border: 1px solid var(--rule-2); }
  button { font: 600 13px/1 var(--sans); border-radius: 7px; padding: 0 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #1a1206; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    main { grid-template-columns: 1fr; }
    .chat { height: 72vh; } .monitors { max-height: none; } .trace { max-height: 40vh; }
  }
</style>
<header>
  <h1>General Agent</h1>
  <span class="stat">turns <b id="s-turns">0</b></span>
  <span class="stat">actions <b id="s-acts">0</b></span>
  <span class="stat">last reply <b id="s-last">–</b></span>
  <span id="mounts"></span>
</header>
<main id="main">
  <section class="chat" aria-label="Conversation">
    <div class="log" id="log" aria-live="polite"></div>
    <form id="form">
      <textarea id="text" placeholder="Say anything. Enter sends, Shift+Enter is a new line. Paste or attach an image to ask about it." aria-label="Message"></textarea>
      <div class="side"><button type="submit">Send</button><label class="attach">Image<input id="file" type="file" accept="image/*" hidden /></label></div>
      <div class="pending" id="pending"></div>
    </form>
  </section>
  <aside id="aside" class="empty">
    <div class="monitors" id="monitors" aria-label="What the agent is plugged into"></div>
    <div class="trace" id="trace" aria-label="What the agent did, event by event"></div>
  </aside>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let turns = 0, acts = 0, pendingImages = [];

  function bubble(from, text, note) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${from}`;
    const who = document.createElement("div"); who.className = "who";
    who.textContent = from === "you" ? "You" : from === "note" ? "" : `Agent${note ? " · " + note : ""}`;
    const body = document.createElement("div"); body.className = "body"; body.textContent = text;
    wrap.append(who, body); $("log").append(wrap); $("log").scrollTop = $("log").scrollHeight;
    return wrap;
  }
  function fmt(v) {
    if (v === null || v === undefined) return "";
    if (typeof v === "object") return JSON.stringify(v);
    return String(v);
  }
  function row(ev) {
    const skip = new Set(["type", "t", "data", "source"]);
    const el = document.createElement("div");
    el.className = "ev" + (ev.type === "verified" || ev.type === "act" ? " good" : "")
      + (ev.type === "unrecorded" || ev.type === "unread" ? " bad" : "");
    const t = document.createElement("div"); t.className = "t"; t.textContent = ev.type;
    const kv = document.createElement("div"); kv.className = "kv";
    kv.innerHTML = Object.entries(ev).filter(([k]) => !skip.has(k))
      .map(([k, v]) => `<span>${k}</span> ${fmt(v).replace(/</g, "&lt;")}`).join("  ·  ");
    el.append(t, kv); $("trace").append(el);
    while ($("trace").childElementCount > 400) $("trace").firstElementChild.remove();
    $("trace").scrollTop = $("trace").scrollHeight;
  }

  // A monitor appears the first time a plugin sends a picture, and never before: an agent with
  // no computers has no screens on the page.
  const monitors = new Map();
  function showFrame(ev) {
    const name = ev.source || "view";
    let m = monitors.get(name);
    if (!m) {
      const box = document.createElement("details"); box.className = "monitor"; box.open = monitors.size === 0;
      const sum = document.createElement("summary");
      sum.innerHTML = `${name}<span class="live">live</span>`;
      const screen = document.createElement("div"); screen.className = "screen";
      const img = document.createElement("img"); img.alt = `Live view of ${name}`;
      screen.append(img); box.append(sum, screen); $("monitors").append(box);
      m = { img }; monitors.set(name, m);
      $("aside").classList.remove("empty");
    }
    m.img.src = "data:image/png;base64," + ev.data;
  }

  function mounts(list) {
    $("mounts").innerHTML = "";
    for (const m of list || []) {
      const chip = document.createElement("span");
      chip.className = "chip" + (m.view ? " on" : "");
      chip.textContent = m.name;
      chip.title = m.about || "";
      $("mounts").append(chip);
    }
    if (!list || !list.length) {
      const chip = document.createElement("span");
      chip.className = "chip"; chip.textContent = "no tools"; chip.title = "conversation only";
      $("mounts").append(chip);
    }
  }

  let working = null;
  function handle(ev) {
    if (ev.type === "frame") return showFrame(ev);
    if (ev.type === "chat") {
      bubble(ev.from === "agent" ? "agent" : "you", ev.text, ev.seconds != null ? `${ev.seconds.toFixed(2)} s` : "");
      if (ev.from === "agent") {
        turns++; $("s-turns").textContent = turns;
        $("s-last").textContent = ev.seconds != null ? ev.seconds.toFixed(2) + " s" : "–";
      }
      return;
    }
    if (ev.type === "note") { bubble("note", ev.text); return; }
    if (ev.type === "busy") {
      if (ev.busy) { working = bubble("note", "thinking…"); }
      else if (working) { working.remove(); working = null; }
      return;
    }
    if (ev.type === "act") { acts++; $("s-acts").textContent = acts; }
    if (ev.type === "ready") { mounts(ev.mounted); $("aside").classList.remove("empty"); }
    row(ev);
  }

  const stream = new EventSource("/events");
  stream.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch (e) { /* keepalive */ } };

  function attach(file) {
    const reader = new FileReader();
    reader.onload = () => {
      pendingImages.push(String(reader.result).split(",")[1]);
      $("pending").textContent = `${pendingImages.length} image(s) attached`;
    };
    reader.readAsDataURL(file);
  }
  $("file").addEventListener("change", (e) => { for (const f of e.target.files) attach(f); });
  $("text").addEventListener("paste", (e) => { for (const item of e.clipboardData.items) if (item.type.startsWith("image/")) attach(item.getAsFile()); });
  async function send(text) {
    if (!text.trim() && !pendingImages.length) return;
    const images = pendingImages; pendingImages = []; $("pending").textContent = "";
    $("text").value = "";
    await fetch("/say", { method: "POST", headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ text, images }) });
  }
  $("form").addEventListener("submit", (e) => { e.preventDefault(); send($("text").value); });
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("text").value); } });
</script>
