<!doctype html>
<title>General Agent</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --ink: #0d1015; --panel: #151a21; --panel-2: #10141a; --rule: #252c36; --rule-2: #313a46;
    --text: #d9dee7; --muted: #8792a3; --accent: #f2b35b; --info: #79bdf2; --you: #1d2a38; --good: #49c28b; --bad: #ee6a5f;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; background: var(--ink); color: var(--text); }
  body { margin: 0; font: 14px/1.45 var(--sans); padding: 12px 16px; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr; gap: 12px; overflow: hidden; }
  header { display: flex; align-items: baseline; gap: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); min-width: 0; }
  header h1 { font: 600 17px/1 var(--sans); margin: 0 auto 0 0; }
  header .stat { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  header .stat b { color: var(--text); font-weight: 500; }
  main { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(340px, 1fr); gap: 16px; min-height: 0; }
  .left { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .screen { position: relative; aspect-ratio: 1280 / 800; background: #07090c; }
  .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .screen .idle { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 13px var(--mono); }
  .trace { overflow-y: auto; padding: 8px 12px; font: 12px/1.5 var(--mono); border-top: 1px solid var(--rule); scrollbar-gutter: stable; }
  .trace .ev { display: grid; grid-template-columns: 76px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #1e242d; }
  .trace .ev .t { color: var(--accent); text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; padding-top: 2px; }
  .trace .ev .kv { overflow-wrap: anywhere; color: var(--text); }
  .trace .ev .kv span { color: var(--muted); }
  .trace .ev.bad .t { color: var(--bad); } .trace .ev.good .t { color: var(--good); }
  .right { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .log { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; scrollbar-gutter: stable; }
  .msg { max-width: 92%; display: grid; gap: 4px; }
  .msg .who { font: 600 10.5px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .msg .body { padding: 9px 11px; border-radius: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; } .msg.user .who { text-align: right; }
  .msg.user .body { background: var(--you); border: 1px solid #2b3d51; }
  .msg.agent .body { background: var(--panel-2); border: 1px solid var(--rule); }
  .working { font: 12px var(--mono); color: var(--accent); }
  form { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--rule); }
  textarea { font: 14px/1.4 var(--sans); color: var(--text); background: var(--panel-2); border: 1px solid var(--rule-2); border-radius: 8px; padding: 9px 10px; resize: vertical; min-height: 62px; box-sizing: border-box; }
  .side { display: grid; gap: 6px; }
  .attach { font: 600 12px/1 var(--sans); border: 1px solid var(--rule-2); border-radius: 7px; padding: 8px 12px; cursor: pointer; text-align: center; color: var(--muted); }
  .pending { grid-column: 1 / -1; font: 12px var(--mono); color: var(--info); }
  .msg .thumb { max-width: 180px; border-radius: 6px; border: 1px solid var(--rule-2); }
  button { font: 600 13px/1 var(--sans); border-radius: 7px; padding: 0 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #1a1206; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
  @media (max-width: 900px) { body { overflow: auto; height: auto; } main { grid-template-columns: 1fr; } .left { grid-template-rows: auto 240px; } .right { height: 70vh; } }
</style>
<header>
  <h1>General Agent</h1>
  <span class="stat">turns <b id="s-turns">0</b></span>
  <span class="stat">actions <b id="s-acts">0</b></span>
  <span class="stat">last reply <b id="s-last">–</b></span>
</header>
<main>
  <section class="left" aria-label="The machine and the agent's trace">
    <div class="screen"><div class="idle" id="idle">starting the desktop…</div><img id="frame" alt="Live view of the desktop" hidden /></div>
    <div class="trace" id="trace" aria-label="What the agent did, event by event"></div>
  </section>
  <section class="right" aria-label="Conversation">
    <div class="log" id="log" aria-live="polite"></div>
    <form id="form">
      <textarea id="text" placeholder="Say anything. Enter sends, Shift+Enter is a new line. Paste or attach an image to ask about it." aria-label="Message"></textarea>
      <div class="side"><button type="submit">Send</button><label class="attach">Image<input id="file" type="file" accept="image/*" hidden /></label></div>
      <div class="pending" id="pending"></div>
    </form>
  </section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), trace = $("trace"), img = $("frame");
  let turns = 0, acts = 0, working = null;
  function bubble(from, text, note) {
    const m = document.createElement("div"); m.className = `msg ${from}`;
    const who = document.createElement("div"); who.className = "who"; who.textContent = (from === "user" ? "You" : "Agent") + (note ? `  ·  ${note}` : "");
    const body = document.createElement("div"); body.className = "body"; body.textContent = text;
    m.append(who, body);
    if (working && from === "agent") log.insertBefore(m, working); else log.append(m);
    log.scrollTop = log.scrollHeight;
  }
  function fmt(v) {
    if (v === null || v === undefined) return "–";
    if (typeof v === "string") return v;
    return JSON.stringify(v);
  }
  // Every event the agent emits is drawn the same way: its type, then its fields.
  function row(ev) {
    const skip = new Set(["type", "t", "data"]);
    const r = document.createElement("div");
    const bad = ev.status === "failed" || ev.status === "rejected" || ev.holds === false || (typeof ev.plan === "object" && ev.plan && ev.plan.reason);
    const good = ev.holds === true || ev.status === "applied";
    r.className = "ev" + (bad ? " bad" : good ? " good" : "");
    const t = document.createElement("div"); t.className = "t"; t.textContent = ev.type;
    const kv = document.createElement("div"); kv.className = "kv";
    for (const [k, v] of Object.entries(ev)) {
      if (skip.has(k)) continue;
      const s = document.createElement("span"); s.textContent = k + "=";
      kv.append(s, document.createTextNode(fmt(v) + "  "));
    }
    r.append(t, kv); trace.append(r); trace.scrollTop = trace.scrollHeight;
  }
  let decoding = false, next = null;
  function showFrame(ev) {
    next = ev; if (decoding) return;
    const f = next; next = null; decoding = true;
    img.onload = img.onerror = () => { decoding = false; if (next) showFrame(next); };
    img.src = "data:image/png;base64," + f.data; img.hidden = false; $("idle").hidden = true;
  }
  const src = new EventSource("events");
  src.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "frame") return showFrame(ev);
    if (ev.type === "chat") { bubble(ev.from, ev.text, ev.seconds != null ? `${ev.seconds.toFixed(2)} s` : ""); if (ev.from === "agent") { turns++; $("s-turns").textContent = turns; $("s-last").textContent = ev.seconds != null ? ev.seconds.toFixed(2) + " s" : "–"; } return; }
    if (ev.type === "busy") {
      if (ev.busy && !working) { working = document.createElement("div"); working.className = "working"; working.textContent = "working…"; log.append(working); }
      if (!ev.busy && working) { working.remove(); working = null; }
      return;
    }
    if (ev.type === "act") { acts++; $("s-acts").textContent = acts; }
    if (ev.type === "ready") $("idle").textContent = "desktop ready";
    row(ev);
  };
  src.onerror = () => { $("idle").textContent = "reconnecting…"; };
  let pending = [];
  function attach(file) {
    if (!file || !file.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = () => { pending.push(String(r.result).split(",")[1]); $("pending").textContent = `${pending.length} image${pending.length > 1 ? "s" : ""} attached`; };
    r.readAsDataURL(file);
  }
  $("file").onchange = (e) => { for (const f of e.target.files) attach(f); e.target.value = ""; };
  $("text").addEventListener("paste", (e) => { for (const item of e.clipboardData.items) if (item.type.startsWith("image/")) attach(item.getAsFile()); });
  async function send(text) {
    text = text.trim(); if (!text && !pending.length) return; $("text").value = "";
    const images = pending; pending = []; $("pending").textContent = "";
    for (const b of images) { const img = document.createElement("img"); img.className = "thumb"; img.src = "data:image/*;base64," + b; img.alt = "attached image"; log.append(img); }
    await fetch("say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, images }) });
  }
  $("form").onsubmit = (e) => { e.preventDefault(); send($("text").value); };
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("text").value); } });
  $("text").focus();
})();
</script>
