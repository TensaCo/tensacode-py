<style>

ontain}.demo-foot{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:93px;padding:20px 0}.metrics{display:flex;gap:42px;flex-wrap:wrap}.metric strong{font-size:23px;font-weight:550;letter-spacing:-.7px;display:block}.metric span{font-size:11px;color:var(--muted)}.clip-select{font:12px system-ui;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:5px;padding:6px;max-width:100%}.downloads{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.download{font-size:12px;white-space:nowrap;text-decoration:none}.download span{margin-left:12px;color:var(--green)}details{font-size:12px;color:var(--muted);max-width:830px}summary{cursor:pointer;width:fit-content}details p{margin:16px 0 8px}details a{color:var(--green)}footer{display:flex;gap:20px;justify-content:space-between;border-top:1px solid var(--line);padding:28px 0 40px;font-size:11px;color:var(--muted)}footer a{text-decoration:none}a:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:5px}@media(max-width:650px){header,main,footer{width:calc(100% - 32px)}header{height:70px}.brand{font-size:16px;white-space:nowrap}nav{gap:11px;font-size:10px}nav a:last-child{white-space:nowrap}.intro{display:block;padding:35px 0 30px}h1{letter-spacing:-1.7px}.intro p{margin-top:20px;max-width:100%}.demo{padding:25px 0 30px}.demo-head{align-items:flex-start}.simulation{font-size:8px;padding:5px 7px;margin-top:3px}.metrics{gap:20px}.metric strong{font-size:20px}.demo-foot{align-items:flex-start;flex-direction:column;gap:15px}.screen{border-radius:7px}footer{flex-wrap:wrap}}

<script>
// Keep simultaneous videos from competing for audio or decode resources.
document.querySelectorAll('video').forEach(video=>video.addEventListener('play',()=>{document.querySelectorAll('video').forEach(other=>{if(other!==video)other.pause()})}));
document.querySelectorAll('.clip-select').forEach(select=>select.addEventListener('change',()=>{const card=select.closest('article');const video=card.querySelector('video');video.src=select.value;video.removeAttribute('poster');video.load();video.play().catch(()=>{});card.querySelector('a[download]').href=select.value}));
</script>
