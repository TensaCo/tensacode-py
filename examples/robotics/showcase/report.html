<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Watch TensorCode humanoid robotics experiments, with recorded comparisons and downloadable evidence.">
<title>Humanoid robotics — TensorCode</title>
<style>
:root{color-scheme:light;--ink:#182a25;--muted:#63746d;--line:#dce4df;--green:#18715c;--paper:#f3f6f3}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}a{color:inherit;text-underline-offset:3px}header,main,footer{width:min(1540px,calc(100% - 64px));margin:auto}header{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:750;letter-spacing:-.6px;text-decoration:none}.brand span{color:var(--green)}header>a:last-child{font-size:12px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:25px 0}.eyebrow{font:600 10px ui-monospace,monospace;letter-spacing:1.5px;color:var(--green)}h1{font-size:24px;font-weight:550;letter-spacing:-.7px;margin:5px 0 0}.experiment-control{display:grid;gap:5px;min-width:330px}.experiment-control label{font-size:11px;color:var(--muted)}select{font:14px system-ui;color:var(--ink);background:#fff;border:1px solid #b7c9c0;border-radius:6px;padding:10px 36px 10px 12px;max-width:100%;cursor:pointer}.demo{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:16px;padding-bottom:20px}.demo-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px}.demo-head .eyebrow{display:none}h2{font-size:21px;letter-spacing:-.5px;font-weight:550;margin:0 0 3px}.demo-head p{font-size:12px;color:var(--muted);margin:0}.simulation{font:10px ui-monospace,monospace;letter-spacing:1px;border:1px solid var(--line);border-radius:20px;padding:6px 10px}.context{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.method{color:var(--green)}.inputs{font-family:ui-monospace,monospace}.screen{background:#102022;border-radius:8px;overflow:hidden;display:flex;align-items:center}.screen video{width:100%;height:100%;max-height:47vh;min-height:260px;object-fit:contain;display:block}.demo-foot{border:1px solid var(--line);background:#fff;border-radius:8px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:25px}.metrics{display:grid;gap:19px}.metric strong{font-size:27px;font-weight:550;letter-spacing:-.7px;display:block}.metric span{font-size:11px;color:var(--muted)}.downloads{display:flex;flex-direction:column;align-items:flex-start;gap:14px}.download{font-size:11px;text-decoration:none;color:var(--green)}.clip-select{font-size:12px;width:100%;padding:8px}.architecture{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 22px 8px}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}h3{margin:0;font-size:13px;font-weight:600}.legend{display:flex;gap:17px;flex-wrap:wrap;color:var(--muted);font-size:10px}.legend span:before{content:'';display:inline-block;width:9px;height:9px;margin-right:5px;background:#f1f5f3;border:1px solid #a6b6ad}.legend span:nth-child(2):before{background:#e3f0e9}.legend span:nth-child(3):before{background:#e8edf8}.legend span:nth-child(4):before{background:#faf0dd}.diagram{overflow-x:auto;padding-top:12px}.diagram svg{display:block;width:100%;min-width:940px;font-family:system-ui,sans-serif;fill:var(--ink)}details{grid-column:1/-1;font-size:12px;color:var(--muted)}summary{cursor:pointer;width:fit-content}details p{max-width:950px;margin:12px 0 8px}details a{color:var(--green)}footer{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:20px 0 26px;font-size:11px;color:var(--muted)}footer a{text-decoration:none}a:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:4px}@media(max-width:800px){header,main,footer{width:calc(100% - 28px)}.toolbar{align-items:stretch;flex-direction:column;gap:14px;padding:20px 0}.experiment-control{min-width:0}.demo{grid-template-columns:minmax(0,1fr)}.demo-foot{flex-direction:row;flex-wrap:wrap;padding:15px}.metrics{display:flex;gap:24px;flex-wrap:wrap}.metric strong{font-size:23px}.downloads{flex-direction:row;align-items:center;flex-wrap:wrap}.clip-select{width:auto}.panel-heading{align-items:flex-start;flex-direction:column;gap:10px}.architecture{padding:15px 12px 5px}.legend{gap:10px}.screen video{min-height:0;max-height:55vh}.brand{font-size:16px}footer{flex-wrap:wrap}}
</style>
</head>
<body>
<header><a class="brand" href="index.html">tensorcode<span> / robotics</span></a><a id="header-evidence" href="{{EVIDENCE}}">Measured evidence ↗</a></header>
<main>
<section class="toolbar"><div><span class="eyebrow">EXPERIMENT DASHBOARD</span><h1>Humanoid control lab</h1></div><div class="experiment-control"><label for="experiment-select">Choose experiment</label><select id="experiment-select" aria-controls="experiment-panels">{{NAV}}</select></div></section>
<div id="experiment-panels">
{{CARDS}}
</div>
</main>
<footer><span>TensorCode · by TensaCo</span><span>Simulation evidence · <a href="{{EVIDENCE}}">Reproduce ↗</a> · <a href="kitting/evidence.html">Earlier experiments ↗</a></span></footer>
<script>
const chooser=document.getElementById('experiment-select');
const panels=[...document.querySelectorAll('.demo')];
function showExperiment(id,updateHash=false){
  const selected=panels.find(panel=>panel.id===id)||panels[0];
  panels.forEach(panel=>{panel.hidden=panel!==selected;if(panel.hidden)panel.querySelector('video').pause()});
  chooser.value=selected.id;
  document.getElementById('header-evidence').href=selected.querySelector('details a').href;
  if(updateHash)history.replaceState(null,'','#'+selected.id);
}
chooser.addEventListener('change',()=>showExperiment(chooser.value,true));
window.addEventListener('hashchange',()=>showExperiment(location.hash.slice(1)));
showExperiment(location.hash.slice(1));
document.querySelectorAll('.clip-select').forEach(select=>select.addEventListener('change',()=>{const card=select.closest('article');const video=card.querySelector('video');video.src=select.value;video.removeAttribute('poster');video.load();video.play().catch(()=>{});card.querySelector('a[download]').href=select.value}));
</script>
</body>
</html>
