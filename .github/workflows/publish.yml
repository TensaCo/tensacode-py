# Publishes to PyPI with trusted publishing (no API token). A `v*` tag publishes
# tensorcode; run the workflow by hand to publish the `tensacode` placeholder.
# PyPI publishers: tensorcode -> environment `pypi`, tensacode -> environment `pypi-tensacode`.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Which distribution to publish
        type: choice
        options: [tensorcode, tensacode]
        default: tensorcode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build
        env:
          PACKAGE: ${{ inputs.package || 'tensorcode' }}
        run: |
          if [ "$PACKAGE" = tensacode ]; then
            python -m build placeholders/tensacode --outdir dist
          else
            python -m build --outdir dist
          fi
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/tensorcode/__init__.py').read())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      # PyPI allows one pending publisher per (repo, workflow, environment), so each project has its own
      name: ${{ inputs.package == 'tensacode' && 'pypi-tensacode' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
