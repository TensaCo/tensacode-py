name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[vec,tools,pretrained,diffusion,dev]'
      - run: python -m pytest -q
      - name: Run the suite from the unpacked sdist
        if: matrix.python-version == '3.12'
        run: |
          python -m build --sdist -o "$RUNNER_TEMP/sdist"
          mkdir "$RUNNER_TEMP/sdist-src"
          tar xzf "$RUNNER_TEMP"/sdist/*.tar.gz -C "$RUNNER_TEMP/sdist-src"
          cd "$RUNNER_TEMP"/sdist-src/tensorcode-*
          python -m pytest -q -p no:cacheprovider
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - name: Check metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Check distribution contents
        run: |
          if tar tzf dist/*.tar.gz | grep -E '/\.development/|/\.github/|__pycache__|\.pyc$'; then
            echo 'unexpected files in sdist'; exit 1
          fi
          if python -m zipfile -l dist/*.whl | grep -Ev '^File Name|^tensorcode/|^tensorcode-[^/]+\.dist-info/'; then
            echo 'unexpected files in wheel'; exit 1
          fi
      - name: Import the dependency-free core
        run: |
          python -m venv /tmp/tensorcode-core
          /tmp/tensorcode-core/bin/pip install --no-deps dist/*.whl
          /tmp/tensorcode-core/bin/python -c "import sys; import tensorcode; from tensorcode import training, Trace, trace, InputRef, OutputRef; from tensorcode.ops import text, graph; from tensorcode import integrations; from tensorcode.tools.cognition import Evidence; from tensorcode.tools.actions import ActionOutcome, action_loop; assert isinstance(trace(), Trace); assert callable(training.Trainer.from_ops); assert callable(training.Trainer.from_tool); assert 'torch' not in sys.modules; assert 'transformers' not in sys.modules; assert text.TextEncoder()('hello')[0].content == 'hello'"
