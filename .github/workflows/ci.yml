name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[vec,dev]'
      - run: python -m pytest -q
      - run: python -m build
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/tensorcode-core
          /tmp/tensorcode-core/bin/pip install --no-deps dist/*.whl
          /tmp/tensorcode-core/bin/python -c "import sys; import tensorcode; from tensorcode.ops import llm, graph; assert 'torch' not in sys.modules; assert llm.TextEncoder()('hello')[0].content == 'hello'"
