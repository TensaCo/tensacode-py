name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[vec,tools,pretrained,diffusion,dev]'
      - run: python -m pytest -q
      - run: python -m build
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/tensorcode-core
          /tmp/tensorcode-core/bin/pip install --no-deps dist/*.whl
          /tmp/tensorcode-core/bin/python -c "import sys; import tensorcode; from tensorcode import training, Trace, trace, InputRef, OutputRef; from tensorcode.ops import text, graph; from tensorcode import integrations; from tensorcode.tools.cognition import Evidence; from tensorcode.tools.actions import ActionOutcome, action_loop; assert isinstance(trace(), Trace); assert callable(training.Trainer.from_ops); assert callable(training.Trainer.from_tool); assert 'torch' not in sys.modules; assert 'transformers' not in sys.modules; assert text.TextEncoder()('hello')[0].content == 'hello'"
